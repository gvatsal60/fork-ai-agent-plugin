name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install browser JavaScript test dependencies
        run: npm ci

      - name: Build and verify
        run: mvn -B clean verify

      - name: Test browser JavaScript
        run: npm test

      - name: Upload coverage report
        if: matrix.java == 21
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Upload HPI
        if: matrix.java == 21
        uses: actions/upload-artifact@v7
        with:
          name: ai-agent.hpi
          path: target/ai-agent.hpi
          retention-days: 30
