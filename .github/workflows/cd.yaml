name: cd

on:
  workflow_dispatch:
    inputs:
      validate_only:
        required: false
        type: boolean
        description: "Run release-drafter validation only and skip publish"
        default: false

permissions:
  checks: read
  contents: write

jobs:
  maven-cd:
    if: ${{ inputs.validate_only == true || github.ref == 'refs/heads/main' }}
    uses: jenkins-infra/github-reusable-workflows/.github/workflows/maven-cd.yml@c2470861b1ad94810dc0d207b011e0b57bb91bbb # v1.8.4
    with:
      validate_only: ${{ inputs.validate_only == true }}
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}
